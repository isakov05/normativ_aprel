<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Realtime Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #log div { margin: 4px 0; }
        .row { display: flex; gap: 8px; }
        #message { flex: 1; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        .name { font-weight: bold; }
    </style>
</head>
<body>
    <h2>Realtime Chat</h2>
    <div class="row" style="margin-bottom: 10px;">
        <input id="username" placeholder="Your name" value="Anonymous">
    </div>
    <div id="log"></div>
    <div class="row">
        <input id="message" placeholder="Type a message..." autocomplete="off">
        <button id="send">Send</button>
    </div>

    <script>
        const roomName = 'lobby';
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(
            protocol + '://' + window.location.host + '/ws/chat/' + roomName + '/'
        );

        const log = document.getElementById('log');
        const messageInput = document.getElementById('message');
        const usernameInput = document.getElementById('username');

        socket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            const line = document.createElement('div');
            line.innerHTML = '<span class="name">' + data.username + ':</span> ' + data.message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        };

        socket.onclose = function () {
            const line = document.createElement('div');
            line.textContent = '[disconnected]';
            log.appendChild(line);
        };

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            socket.send(JSON.stringify({
                message: message,
                username: usernameInput.value || 'Anonymous'
            }));
            messageInput.value = '';
        }

        document.getElementById('send').onclick = sendMessage;
        messageInput.addEventListener('keyup', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
